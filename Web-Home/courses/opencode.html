<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="../icons/icon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OpenCode Agent Course - Sinos 101. Coming soon.">
  <title>OpenCode Course | Sinos 101</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/courses.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <a href="../index.html" class="logo" style="text-decoration:none;">
      <img class="dynamic-brand-logo" src="../icons/sinos-icon.svg" width="24" height="24" alt="Sinos CLI">
      <span>Sinos 101</span>
    </a>
    <nav class="course-tabs"></nav>
    <nav class="nav-links">
      <button class="icon-switch" id="theme-toggle" aria-label="Toggle Theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </button>
      <button class="lang-switch" id="lang-toggle">English / 中文</button>
    </nav>
  </header>

  <main class="course-placeholder">
    <div class="placeholder-content">
      <h1 id="placeholder-title">OpenCode</h1>
      <p id="placeholder-msg">Course under development...</p>
      <a href="claude-code.html" class="placeholder-link" id="placeholder-link">&larr; Back to Claude Code Course</a>
    </div>
  </main>

  <script>
  (function() {
    // Theme toggle
    const theme = localStorage.getItem("coffee-cli-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    const themeBtn = document.getElementById("theme-toggle");
    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("coffee-cli-theme", next);
      });
    }

    // Language toggle
    const langToggle = document.getElementById("lang-toggle");
    let currentLang = localStorage.getItem("coffee-cli-lang") || (navigator.language.includes("zh") ? "zh" : "en");

    function updateLangUI() {
      document.documentElement.lang = currentLang;
      langToggle.textContent = currentLang === "en" ? "English / \u4e2d\u6587" : "\u4e2d\u6587 / English";
      document.getElementById("placeholder-msg").textContent = currentLang === "zh"
        ? "\u8bfe\u7a0b\u6b63\u5728\u5f00\u53d1\u4e2d..."
        : "Course under development...";
      document.getElementById("placeholder-link").innerHTML = currentLang === "zh"
        ? "&larr; \u8fd4\u56de Claude Code \u8bfe\u7a0b"
        : "&larr; Back to Claude Code Course";
    }

    updateLangUI();

    if (langToggle) {
      langToggle.addEventListener("click", () => {
        currentLang = currentLang === "en" ? "zh" : "en";
        localStorage.setItem("coffee-cli-lang", currentLang);
        updateLangUI();
      });
    }
  })();
  </script>

  <script src="../js/course-tabs.js"></script>
</body>
</html>
